name = specialCharacter
summary = "specialCharacter"
description = """Special Character is an NVDA add-on that lets you instantly insert symbols and special characters anywhere. It features two customizable sets of twelve slots, a dedicated settings panel, and context-aware insertion logic for various apps. It also includes smart tap control, dedicated dash shortcuts, and persistent configuration.
Hot Keys:
Ctrl+0-9, Ctrl+Minus, and Ctrl+Equals : Insert Slot 1-12
Shift+Windows+. : Insert En Dash
Shift+Windows+/ : Insert Em Dash
Shift+Backspace
Single tap: Toggle character set
Double tap: Toggle On or Off"""
author = "Chai Chaimee <chaicm75@gmail.com>"
url = https://github.com/chaichaimee/specialCharacter
version = 2026.11.0
changelog = """Settings file now lives in userConfig\ChaiChaimee\specialCharacter\ and older copies are moved there automatically. Fix pasting in Word on NVDA 2026.1 64-bit. Shortcuts pass through to the application while the add-on is off. Cancel in the settings panel no longer keeps unsaved edits. Missing slots in the settings file fall back to defaults, and saving is crash-safe. Fix untranslated messages in the settings panel."""
docFileName = readme.html
minimumNVDAVersion = 2025.1.0
lastTestedNVDAVersion = 2026.3.0
updateChannel = None
