name = specialCharacter
summary = "specialCharacter"
description = """Special Character is an NVDA add-on that lets you instantly insert symbols and special characters anywhere. It features two customizable sets of twelve slots, a dedicated settings panel, and context-aware insertion logic for various apps. It also includes smart tap control, dedicated dash shortcuts, and persistent configuration.
Hot Keys:
Ctrl+0-9, Ctrl+Minus, and Ctrl+Equals : Insert Slot 1-12
Shift+Windows+. : Insert En Dash
Shift+Windows+/ : Insert Em Dash
Shift+Backspace
Single tap: Toggle character set
Double tap: Toggle On or Off"""
author = "Chai Chaimee <chaicm75@gmail.com>"
